<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple job application form demonstrating HTML input types.">
  <title>Job Application Form</title>
</head>
<body>
<h1>Job Application Form</h1>
  <form action="#" method="get">
    <fieldset><legend>Personal Details</legend>
      <p><label for="name">Full name</label><br><input id="name" name="name" type="text" required></p>
      <p><label for="email">Email</label><br><input id="email" name="email" type="email" required></p>
      <p><label for="website">Portfolio URL</label><br><input id="website" name="website" type="url"></p>
    </fieldset>
    <fieldset><legend>Job Details</legend>
      <p><label for="position">Position</label><br><select id="position" name="position"><option>Web Developer Intern</option><option>UI Designer Intern</option><option>QA Intern</option></select></p>
      <p><label for="start">Available from</label><br><input id="start" name="start" type="date"></p>
      <p><label for="skills">Skills</label><br><textarea id="skills" name="skills" rows="3"></textarea></p>
      <p><label for="resume">Resume file</label><br><input id="resume" name="resume" type="file"></p>
    </fieldset>
    <button type="submit">Submit Application</button>
  </form>
  <p>This is a practice form. It does not send an application.</p>
</body>
</html>
