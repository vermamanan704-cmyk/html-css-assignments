<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple HTML table with headers and a caption.">
  <title>Sample Size Chart</title>
  <style>
body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; }
    th, td { padding: 8px; text-align: left; }
    th { background: #eeeeee; }
  </style>
</head>
<body>
<h1>Sample T-Shirt Size Chart</h1>
  <p>This table is an example for learning HTML tables.</p>
  <table border="1">
    <caption>Example measurements in centimetres</caption>
    <thead><tr><th scope="col">Size</th><th scope="col">Chest</th><th scope="col">Length</th></tr></thead>
    <tbody><tr><td>S</td><td>92</td><td>68</td></tr><tr><td>M</td><td>98</td><td>70</td></tr><tr><td>L</td><td>104</td><td>72</td></tr><tr><td>XL</td><td>110</td><td>74</td></tr></tbody>
  </table>
</body>
</html>
