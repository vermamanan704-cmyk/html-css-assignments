<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple example of content, padding, border and margin.">
  <title>CSS Box Model</title>
  <style>
body { font-family: Arial, sans-serif; margin: 20px; }
    .box { width: 200px; padding: 20px; border: 5px solid #174a7e; margin: 20px; background: #eaf2f8; }
  </style>
</head>
<body>
<h1>CSS Box Model</h1>
  <p>The box has a content width of 200 pixels, padding of 20 pixels and a border of 5 pixels.</p>
  <div class="box">Content width is 200 pixels</div>
  <p>Total width: 200 + 40 padding + 10 border = 250 pixels.</p>
  <p>With 20 pixels of margin on each side, the total horizontal space is 290 pixels.</p>
</body>
</html>
