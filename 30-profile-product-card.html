<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Two basic cards demonstrating spacing, borders and headings.">
  <title>Profile and Product Cards</title>
  <style>
body { font-family: Arial, sans-serif; margin: 20px; }
    .cards { display: flex; flex-wrap: wrap; gap: 16px; }
    .card { width: 260px; padding: 16px; border: 1px solid #cccccc; }
    h2 { color: #174a7e; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
<h1>Cards</h1>
  <div class="cards">
    <section class="card"><h2>Manan Verma</h2><p>BCA Artificial Intelligence student</p><p>Badaun, Uttar Pradesh</p><p>Skills: HTML, CSS, Java and AI basics</p><p><a href="https://github.com/vermamanan704-cmyk">GitHub profile</a></p></section>
    <section class="card"><h2>Wireless Headphones</h2><p>Sample product card</p><p>Example price: Rs. 2799</p><button type="button">View Product</button></section>
  </div>
</body>
</html>
