<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A navigation menu arranged with Flexbox.">
  <title>Flexbox Menu Bar</title>
  <style>
body { font-family: Arial, sans-serif; margin: 0; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px; background: #eaf2f8; flex-wrap: wrap; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; }
    main { padding: 16px; }
    @media (max-width: 500px) { .bar { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
<header class="bar"><h1>My Website</h1><nav><a href="#home">Home</a><a href="#services">Services</a><a href="#projects">Projects</a><a href="#contact">Contact</a></nav></header>
  <main><section id="home"><h2>Home</h2><p>Resize the browser to see the menu wrap.</p></section><section id="services"><h2>Services</h2></section><section id="projects"><h2>Projects</h2></section><section id="contact"><h2>Contact</h2></section></main>
</body>
</html>
