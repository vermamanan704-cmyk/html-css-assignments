<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A product grid demonstrating CSS Grid auto-fit and minmax.">
  <title>Auto Fit Product Grid</title>
  <style>
body { font-family: Arial, sans-serif; margin: 20px; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    article { padding: 16px; border: 1px solid #cccccc; }
  </style>
</head>
<body>
<h1>Sample Products</h1><p>Resize the browser to change the number of columns.</p>
  <main class="products"><article><h2>Notebook</h2><p>Example price: Rs. 99</p></article><article><h2>Pen Set</h2><p>Example price: Rs. 49</p></article><article><h2>Desk Lamp</h2><p>Example price: Rs. 749</p></article><article><h2>Backpack</h2><p>Example price: Rs. 899</p></article></main>
</body>
</html>
