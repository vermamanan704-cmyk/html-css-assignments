<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple store layout using a header, sidebar and CSS Grid products.">
  <title>Grid Store Layout</title>
  <style>
body { font-family: Arial, sans-serif; margin: 0; }
    .layout { display: grid; grid-template-columns: 180px 1fr; grid-template-areas: "header header" "sidebar main" "footer footer"; gap: 12px; padding: 12px; }
    header { grid-area: header; background: #eaf2f8; padding: 12px; }
    aside { grid-area: sidebar; }
    main { grid-area: main; }
    footer { grid-area: footer; border-top: 1px solid #cccccc; padding: 8px; }
    .products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    article { border: 1px solid #cccccc; padding: 12px; }
    @media (max-width: 550px) { .layout { grid-template-columns: 1fr; grid-template-areas: "header" "sidebar" "main" "footer"; } .products { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="layout"><header><h1>Sample Store</h1></header>
    <aside><h2>Categories</h2><ul><li>Study</li><li>Electronics</li><li>Home</li></ul></aside>
    <main><h2>Products</h2><div class="products"><article><h3>Notebook</h3><p>Example price: Rs. 99</p></article><article><h3>Backpack</h3><p>Example price: Rs. 899</p></article><article><h3>Desk Lamp</h3><p>Example price: Rs. 749</p></article><article><h3>Headphones</h3><p>Example price: Rs. 1999</p></article></div></main>
    <footer><p>Sample store layout</p></footer></div>
</body>
</html>
